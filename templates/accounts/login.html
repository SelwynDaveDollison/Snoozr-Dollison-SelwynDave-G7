{% extends "accounts/auth_base.html" %}

{% block title %}Login - Snoozr{% endblock %}

{% block auth_content %}
<div class="text-center mb-4">
    <i class="bi bi-moon-stars-fill brand-icon"></i>
    <h2 class="mt-2 fw-bold">Welcome to Snoozr</h2>
    <p class="text-muted">Sign in to track your sleep</p>
</div>

<form method="POST" action="{% url 'accounts:login' %}">
    {% csrf_token %}

    <div class="mb-3">
        <label for="username" class="form-label fw-semibold">Username</label>
        <div class="input-group">
            <span class="input-group-text"><i class="bi bi-person"></i></span>
            <input type="text" name="username" id="username" class="form-control" placeholder="Enter your username" required autofocus>
        </div>
    </div>

    <div class="mb-4">
        <label for="password" class="form-label fw-semibold">Password</label>
        <div class="input-group">
            <span class="input-group-text"><i class="bi bi-lock"></i></span>
            <input type="password" name="password" id="password" class="form-control" placeholder="Enter your password" required>
        </div>
    </div>

    <button type="submit" class="btn btn-snoozr mb-3">
        <i class="bi bi-box-arrow-in-right me-2"></i>Sign In
    </button>
</form>

<div class="text-center">
    <p class="mb-0">Don't have an account? <a href="{% url 'accounts:register' %}" class="fw-semibold">Create one</a></p>
</div>
{% endblock %}
