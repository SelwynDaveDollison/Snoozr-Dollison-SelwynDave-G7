{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Snoozr{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        :root {
            --snoozr-primary: #4e54c8;
            --snoozr-secondary: #8f94fb;
            --snoozr-dark: #1a1a2e;
        }
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, var(--snoozr-dark) 0%, #16213e 50%, #0f3460 100%);
        }
        .auth-card {
            border-radius: 20px;
            padding: 40px;
            max-width: 450px;
            width: 100%;
            background: white;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        .btn-snoozr {
            background: linear-gradient(135deg, var(--snoozr-primary), var(--snoozr-secondary));
            border: none;
            color: white;
            padding: 10px 30px;
            border-radius: 25px;
            font-weight: 600;
            transition: all 0.3s ease;
            width: 100%;
        }
        .btn-snoozr:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(78, 84, 200, 0.4);
            color: white;
        }
        .form-control:focus {
            border-color: var(--snoozr-secondary);
            box-shadow: 0 0 0 0.2rem rgba(143, 148, 251, 0.25);
        }
        .brand-icon { font-size: 2.5rem; color: var(--snoozr-primary); }
        .alert { border-radius: 10px; border: none; }
        a { color: var(--snoozr-primary); }
        a:hover { color: var(--snoozr-secondary); }

        .stars {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            overflow: hidden;
            z-index: 0;
        }
        .star {
            position: absolute;
            width: 3px; height: 3px;
            background: white;
            border-radius: 50%;
            opacity: 0.5;
            animation: twinkle 3s infinite alternate;
        }
        @keyframes twinkle {
            0% { opacity: 0.3; }
            100% { opacity: 1; }
        }
    </style>
</head>
<body>
    <!-- Stars background -->
    <div class="stars">
        {% for i in "xxxxxxxxxxxxxxxxxxxx" %}
        <div class="star" style="top: {{ forloop.counter0|add:'5' }}%; left: {% widthratio forloop.counter 1 5 %}%; animation-delay: {{ forloop.counter0 }}00ms;"></div>
        {% endfor %}
    </div>

    <div class="auth-card position-relative" style="z-index: 1;">
        <!-- Messages -->
        {% if messages %}
        {% for message in messages %}
        <div class="alert alert-{% if message.tags == 'error' %}danger{% else %}{{ message.tags }}{% endif %} alert-dismissible fade show mb-3" role="alert">
            {{ message }}
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        {% endfor %}
        {% endif %}

        {% block auth_content %}{% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
